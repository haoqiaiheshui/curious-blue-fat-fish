<!-- 本文件来自 qq-ai-companion 开源示例 -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>QQ 登录二维码（自动刷新）</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:"Microsoft YaHei",sans-serif;}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;}
  img{width:min(70vh,70vw);height:min(70vh,70vw);image-rendering:pixelated;border:1px solid #ddd;}
  .t{margin-top:14px;font-size:22px;color:#0a0;}
  .h{font-size:15px;color:#666;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <img id="qr" src="napcat-qr-big.png" alt="二维码">
  <div class="t" id="age">加载中…</div>
  <div class="h">NapCat 每 2 分钟自动刷新；手机 QQ → 扫一扫 → 对准屏幕</div>
</div>
<script>
let last = '';
async function tick(){
  try{
    const r = await fetch('napcat-qr-big.png?_=' + Date.now(), {cache:'no-store'});
    const b = await r.blob();
    if (b.size !== last) { last = b.size; document.getElementById('qr').src = URL.createObjectURL(b); }
    document.getElementById('age').textContent = '已刷新：' + new Date().toLocaleTimeString('zh-CN');
  }catch(e){ document.getElementById('age').textContent = '刷新失败，重试中…'; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
